spring.application.name=avistamientos

# Misma base de datos y usuario de las tareas 2 y 3 (ver database/tarea2.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?characterEncoding=UTF-8
spring.datasource.username=cc5002
spring.datasource.password=programacionweb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Las tablas ya existen (las crean los .sql de database/). Hibernate no debe crearlas ni modificarlas.
spring.jpa.hibernate.ddl-auto=none
# Las consultas terminan dentro del servicio; no se deja la sesion de JPA abierta hasta la vista.
spring.jpa.open-in-view=false

server.port=8080

# Direccion de la aplicacion Flask (tareas 2 y 3), para los enlaces del menu
app.flask-url=http://127.0.0.1:5000
